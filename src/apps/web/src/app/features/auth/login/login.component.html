<div
    style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: var(--slate-50);">
    <div class="card" style="width: 100%; max-width: 400px; padding: 2.5rem;">
        <h2 style="margin-top: 0; text-align: center; color: var(--slate-900);">Sign in to Payroll</h2>
        <p style="text-align: center; color: var(--slate-500); margin-bottom: 2rem;">Welcome back to your payroll
            dashboard</p>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label class="form-label" for="email">Email address</label>
                <input type="text" formControlName="email" class="form-input"
                    [class.is-invalid]="submitted && f['email'].errors">
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" formControlName="password" class="form-input"
                    [class.is-invalid]="submitted && f['password'].errors">
            </div>

            <div *ngIf="error"
                style="background-color: #fee2e2; color: #b91c1c; padding: 0.75rem; border-radius: 0.375rem; margin-bottom: 1rem; font-size: 0.875rem;">
                Login failed. Try <strong>admin@tenant1.com</strong> / <strong>pass123</strong>
            </div>

            <button [disabled]="loading" class="btn btn-primary" style="width: 100%; justify-content: center;">
                {{ loading ? 'Signing in...' : 'Sign In' }}
            </button>

            <div style="margin-top: 1.5rem; text-align: center; font-size: 0.875rem; color: var(--slate-500);">
                <p>Demo Credentials:</p>
                <code
                    style="display: block; background: var(--slate-100); padding: 0.5rem;">admin@tenant1.com / pass123</code>
            </div>
        </form>
    </div>
</div>
