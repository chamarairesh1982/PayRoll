name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20.x'
  
jobs:
  # ===== Backend Jobs =====
  backend-build-test:
    name: Backend - Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          
      - name: Restore dependencies
        run: dotnet restore PayrollSolution.sln
        
      - name: Build
        run: dotnet build PayrollSolution.sln --configuration Release --no-restore
        
      - name: Run unit tests
        run: dotnet test backend/Payroll.Application.Tests --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"
        
      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Backend Test Results
          path: '**/test-results.trx'
          reporter: dotnet-trx
          
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/Payroll.Api/bin/Release/
          retention-days: 7

  backend-lint:
    name: Backend - Lint & Format Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          
      - name: Restore dependencies
        run: dotnet restore PayrollSolution.sln
        
      - name: Check code formatting
        run: dotnet format PayrollSolution.sln --verify-no-changes --verbosity diagnostic

  # ===== Frontend Jobs =====
  frontend-build-test:
    name: Frontend - Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/payroll-web/package-lock.json
          
      - name: Install dependencies
        working-directory: frontend/payroll-web
        run: npm ci
        
      - name: Lint
        working-directory: frontend/payroll-web
        run: npm run lint
        
      - name: Build
        working-directory: frontend/payroll-web
        run: npm run build -- --configuration production
        
      - name: Run unit tests
        working-directory: frontend/payroll-web
        run: npm run test:ci
        
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/payroll-web/dist/
          retention-days: 7

  # ===== E2E Tests =====
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-build-test, frontend-build-test]
    if: github.event_name == 'pull_request'
    
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2019-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: YourStrong@Passw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P YourStrong@Passw0rd -Q 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: Restore backend dependencies
        run: dotnet restore PayrollSolution.sln
        
      - name: Setup database
        working-directory: backend/Payroll.Api
        env:
          ConnectionStrings__DefaultConnection: "Server=localhost;Database=Payroll;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True"
        run: |
          dotnet ef database update --project ../Payroll.Infrastructure --startup-project .
          
      - name: Start backend
        working-directory: backend/Payroll.Api
        env:
          ConnectionStrings__DefaultConnection: "Server=localhost;Database=Payroll;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True"
        run: |
          dotnet run --urls http://localhost:52938 &
          sleep 10
          
      - name: Install frontend dependencies
        working-directory: frontend/payroll-web
        run: npm ci
        
      - name: Start frontend
        working-directory: frontend/payroll-web
        run: |
          npm start &
          sleep 30
          
      - name: Install Playwright
        working-directory: qa-automation
        run: |
          npm ci
          npx playwright install --with-deps
          
      - name: Run E2E tests
        working-directory: qa-automation
        run: npx playwright test
        
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: qa-automation/playwright-report/
          retention-days: 30

  # ===== Security Scan =====
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ===== Code Quality =====
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis
          
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          
      # Future: Add SonarCloud or similar
      - name: Placeholder for SonarCloud
        run: echo "SonarCloud integration coming soon"

  # ===== Deployment (Future) =====
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [backend-build-test, frontend-build-test, backend-lint]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.payroll.lk
    
    steps:
      - name: Placeholder for deployment
        run: echo "Deployment to staging coming soon"
        
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [backend-build-test, frontend-build-test, backend-lint, e2e-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://payroll.lk
    
    steps:
      - name: Placeholder for deployment
        run: echo "Deployment to production coming soon"
