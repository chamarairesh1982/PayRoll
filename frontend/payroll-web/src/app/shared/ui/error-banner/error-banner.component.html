<section class="error-banner" role="alert" aria-live="assertive">
  <div class="error-banner__content">
    <i class="pi pi-exclamation-triangle" aria-hidden="true"></i>
    <div>
      <h4 class="error-banner__title">{{ title }}</h4>
      <p class="error-banner__message">{{ message }}</p>
    </div>
  </div>
  <button
    pButton
    type="button"
    class="p-button-text"
    icon="pi pi-refresh"
    [label]="retryLabel"
    (click)="retry.emit()"
    aria-label="Retry"
  ></button>
</section>
