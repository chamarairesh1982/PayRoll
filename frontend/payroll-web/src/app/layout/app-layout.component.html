<div class="app-layout">
  <p-toast></p-toast>
  <p-confirmDialog></p-confirmDialog>

  <p-toolbar class="app-layout__topbar">
    <div class="app-layout__topbar-left">
      <button
        pButton
        class="app-layout__menu-btn"
        icon="pi pi-bars"
        (click)="toggleSidebar()"
        aria-label="Toggle menu"
      ></button>
      <span class="app-layout__logo">WorldBets Payroll</span>
      <p-dropdown
        class="app-layout__tenant"
        [options]="companyOptions"
        [(ngModel)]="selectedCompany"
        optionLabel="label"
        placeholder="Company"
        aria-label="Select company"
      ></p-dropdown>
      <p-dropdown
        class="app-layout__tenant"
        [options]="branchOptions"
        [(ngModel)]="selectedBranch"
        optionLabel="label"
        placeholder="Branch"
        aria-label="Select branch"
      ></p-dropdown>
      <p-dropdown
        class="app-layout__tenant"
        [options]="costCenterOptions"
        [(ngModel)]="selectedCostCenter"
        optionLabel="label"
        placeholder="Cost Center"
        aria-label="Select cost center"
      ></p-dropdown>
    </div>
    <div class="app-layout__topbar-center">
      <span class="p-input-icon-left app-layout__search">
        <i class="pi pi-search"></i>
        <input
          pInputText
          type="text"
          placeholder="Search employees, pay runs, payslips"
          aria-label="Global search"
        />
      </span>
    </div>
    <div class="app-layout__topbar-right">
      <div class="app-layout__density">
        <span class="app-layout__density-label">Density</span>
        <p-dropdown
          [options]="densityOptions"
          [(ngModel)]="selectedDensity"
          optionLabel="label"
          (onChange)="onDensityChange($event.value)"
        ></p-dropdown>
      </div>
      <button
        pButton
        type="button"
        class="p-button-text p-button-rounded"
        icon="pi pi-bell"
        aria-label="Notifications"
      ></button>
      <button
        pButton
        type="button"
        class="p-button-text p-button-rounded"
        icon="pi pi-user"
        (click)="userMenu.toggle($event)"
        aria-label="User menu"
      ></button>
      <p-menu #userMenu [popup]="true" [model]="userMenuItems"></p-menu>
    </div>
  </p-toolbar>

  <div class="app-layout__body">
    <aside class="app-layout__sidebar">
      <p-panelMenu [model]="menuItems"></p-panelMenu>
    </aside>

    <main class="app-layout__content">
      <app-breadcrumb></app-breadcrumb>
      <section class="app-layout__page">
        <router-outlet></router-outlet>
      </section>
    </main>
  </div>

  <p-sidebar
    [(visible)]="sidebarVisible"
    [modal]="true"
    position="left"
    styleClass="app-layout__mobile-sidebar"
  >
    <p-panelMenu [model]="menuItems"></p-panelMenu>
  </p-sidebar>
</div>
