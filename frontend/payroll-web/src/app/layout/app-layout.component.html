<div class="app-layout">
  <p-toast></p-toast>
  <p-confirmDialog></p-confirmDialog>

  <p-toolbar class="app-layout__topbar">
    <div class="app-layout__topbar-left">
      <button
        pButton
        class="app-layout__menu-btn"
        icon="pi pi-bars"
        (click)="toggleSidebar()"
        aria-label="Toggle menu"
      ></button>
      <div class="app-layout__brand">
        <span class="app-layout__logo">WorldBets Payroll</span>
        <small class="app-layout__context">{{ selectedCompanyLabel }}</small>
      </div>
      <p-dropdown
        class="app-layout__tenant"
        [options]="companyOptions"
        [(ngModel)]="selectedCompany"
        optionLabel="label"
        placeholder="Company"
        aria-label="Select company"
        (onChange)="onCompanyChange($event)"
      ></p-dropdown>
      <p-dropdown
        class="app-layout__tenant"
        [options]="branchOptions"
        [(ngModel)]="selectedBranch"
        optionLabel="label"
        placeholder="Branch"
        aria-label="Select branch"
      ></p-dropdown>
      <p-dropdown
        class="app-layout__tenant"
        [options]="costCenterOptions"
        [(ngModel)]="selectedCostCenter"
        optionLabel="label"
        placeholder="Cost Center"
        aria-label="Select cost center"
      ></p-dropdown>
    </div>
    <div class="app-layout__topbar-center">
      <span class="p-input-icon-left app-layout__search">
        <i class="pi pi-search"></i>
        <input
          pInputText
          type="text"
          placeholder="Search employees, pay runs, payslips"
          aria-label="Global search"
        />
      </span>
    </div>
    <div class="app-layout__topbar-right">
      <div class="app-layout__density">
        <span class="app-layout__density-label">Density</span>
        <p-dropdown
          [options]="densityOptions"
          [(ngModel)]="selectedDensity"
          optionLabel="label"
          (onChange)="onDensityChange($event.value)"
        ></p-dropdown>
      </div>
      <button
        pButton
        type="button"
        class="p-button-text p-button-rounded"
        icon="pi pi-bell"
        aria-label="Notifications"
      ></button>
      <div class="app-layout__user" (click)="userMenu.toggle($event)" tabindex="0" role="button">
        <span class="pi pi-user app-layout__user-avatar" aria-hidden="true"></span>
        <div class="app-layout__user-meta">
          <div class="app-layout__user-name">{{ userName }}</div>
          <div class="app-layout__user-role">{{ userRole }}</div>
        </div>
        <span class="pi pi-chevron-down" aria-hidden="true"></span>
      </div>
      <p-menu #userMenu [popup]="true" [model]="userMenuItems"></p-menu>
    </div>
  </p-toolbar>

  <div class="app-layout__body">
    <aside class="app-layout__sidebar">
      <p-panelMenu
        [model]="menuItems"
        (onNodeSelect)="onMenuSelect()"
      ></p-panelMenu>
    </aside>

    <main class="app-layout__content">
      <app-breadcrumb></app-breadcrumb>
      <section class="app-layout__page">
        <router-outlet></router-outlet>
      </section>
    </main>
  </div>

  <p-sidebar
    [(visible)]="sidebarVisible"
    [modal]="true"
    position="left"
    styleClass="app-layout__mobile-sidebar"
  >
    <p-panelMenu
      [model]="menuItems"
      (onNodeSelect)="onMenuSelect()"
    ></p-panelMenu>
  </p-sidebar>
</div>
