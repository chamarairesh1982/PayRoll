<div class="page-header">
  <div>
    <h1>Attendance</h1>
    <p class="subtitle">Track hours worked and attendance periods.</p>
  </div>
  <button
    pButton
    type="button"
    [label]="showCreateForm ? 'Close Form' : 'Add Attendance'"
    icon="pi pi-plus"
    class="p-button-raised"
    (click)="toggleCreateForm()"
  ></button>
</div>

<div class="create-section" *ngIf="showCreateForm">
  <h2>New Attendance Record</h2>
  <app-attendance-form mode="create" (submitted)="handleCreate($event)"></app-attendance-form>
</div>

<div class="error" *ngIf="errorMessage">{{ errorMessage }}</div>

<app-data-table
  [columns]="columns"
  [data]="records"
  [loading]="isLoading"
  [totalRecords]="totalCount"
  [rows]="pageSize"
  [first]="tableFirst"
  [paginator]="true"
  [lazy]="true"
  [showColumnFilters]="false"
  [emptyMessage]="'No attendance records found.'"
  (lazyLoad)="handleLazyLoad($event)"
></app-data-table>
