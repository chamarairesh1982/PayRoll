<form [formGroup]="form" (ngSubmit)="onSubmit()" class="pay-run-form">
  <div class="grid">
    <label>
      Name
      <input type="text" formControlName="name" />
      <app-form-field-error [control]="form.get('name')"></app-form-field-error>
    </label>

    <label>
      Period Type
      <select formControlName="periodType">
        <option *ngFor="let type of periodTypes" [value]="type">{{ type }}</option>
      </select>
      <app-form-field-error [control]="form.get('periodType')"></app-form-field-error>
    </label>

    <label>
      Period Start
      <input type="date" formControlName="periodStart" />
      <app-form-field-error [control]="form.get('periodStart')"></app-form-field-error>
    </label>

    <label>
      Period End
      <input type="date" formControlName="periodEnd" />
      <app-form-field-error [control]="form.get('periodEnd')"></app-form-field-error>
      <div class="error" *ngIf="periodRangeInvalid">Period end must be on or after start.</div>
    </label>

    <label>
      Pay Date
      <input type="date" formControlName="payDate" />
      <app-form-field-error [control]="form.get('payDate')"></app-form-field-error>
    </label>

    <label>
      Company
      <input type="text" formControlName="companyId" placeholder="Company Id (optional)" />
    </label>

    <label>
      Branch
      <input type="text" formControlName="branchId" placeholder="Branch Id (optional)" />
    </label>

    <label>
      Cost Center
      <input type="text" formControlName="costCenterId" placeholder="Cost Center Id (optional)" />
    </label>

    <label class="checkbox-field">
      <input type="checkbox" formControlName="isConsolidated" />
      <span>Consolidated pay run across scope</span>
    </label>

    <label class="checkbox-field">
      <input type="checkbox" formControlName="includeActiveEmployeesOnly" />
      <span>Include Active Employees Only</span>
    </label>

    <label class="full-width">
      Employees
      <input
        type="text"
        [value]="employeeSearch"
        (input)="onEmployeeSearchChange($event.target.value)"
        placeholder="Search by name, code, or initials"
      />
      <select
        multiple
        formControlName="employeeIds"
        [disabled]="loadingEmployees || !!employeesLoadError"
        [attr.aria-busy]="loadingEmployees"
      >
        <option *ngFor="let employee of filteredEmployees" [value]="employee.id">
          {{ employee.employeeCode }} - {{ employee.firstName }} {{ employee.lastName }}
          ({{ employee.isActive ? 'Active' : 'Inactive' }})
        </option>
      </select>
      <div class="helper-text" *ngIf="loadingEmployees">Loading employees...</div>
      <div class="helper-text error" *ngIf="employeesLoadError">{{ employeesLoadError }}</div>
      <div class="helper-text" *ngIf="!loadingEmployees && !employeesLoadError">
        Hold Ctrl/⌘ to select multiple employees.
      </div>
    </label>
  </div>

  <div class="actions">
    <button type="submit">{{ mode === 'create' ? 'Create Pay Run' : 'Save Changes' }}</button>
  </div>
</form>
