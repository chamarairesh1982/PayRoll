<div class="page-header">
  <h1>Pay Runs</h1>
  <button type="button" (click)="goToCreate()">Create Pay Run</button>
</div>

<div class="filters">
  <label>
    Status
    <select [(ngModel)]="selectedStatus" (change)="onStatusChange()">
      <option [value]="''">All</option>
      <option *ngFor="let status of statusOptions.slice(1)" [value]="status">{{ status }}</option>
    </select>
  </label>
  <label>
    Company
    <input type="text" [(ngModel)]="companyFilter" (change)="onScopeChange()" placeholder="Company Id" />
  </label>
  <label>
    Branch
    <input type="text" [(ngModel)]="branchFilter" (change)="onScopeChange()" placeholder="Branch Id" />
  </label>
  <label>
    Cost Center
    <input type="text" [(ngModel)]="costCenterFilter" (change)="onScopeChange()" placeholder="Cost Center Id" />
  </label>
  <label>
    Consolidated
    <select [(ngModel)]="consolidatedFilter" (change)="onScopeChange()">
      <option value="">All</option>
      <option value="true">Consolidated</option>
      <option value="false">Per entity</option>
    </select>
  </label>
</div>

<div *ngIf="isLoading" class="loading">Loading pay runs...</div>

<ng-template #actions let-payRun>
  <div class="actions">
    <button type="button" (click)="viewPayRun(payRun)">View</button>
  </div>
</ng-template>

<app-data-table [columns]="columns" [data]="payRuns" [actionsTemplate]="actions"></app-data-table>

<div class="pagination">
  <button type="button" (click)="previousPage()" [disabled]="page === 1">Previous</button>
  <span>Page {{ page }}</span>
  <button type="button" (click)="nextPage()" [disabled]="page * pageSize >= totalCount">Next</button>
</div>
