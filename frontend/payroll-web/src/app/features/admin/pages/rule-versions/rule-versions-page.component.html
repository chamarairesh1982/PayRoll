<div class="page-container animate-fadeIn">
  <!-- Context Header: Institutional Governance -->
  <div class="flex flex-column md:flex-row md:justify-content-between md:align-items-end gap-4 mb-6">
    <div>
      <h1 class="m-0 text-3xl font-extrabold tracking-tight text-900 line-height-1">Institutional Rule Manifest</h1>
      <p class="text-600 mt-2 mb-0">Versioning ledger for fiscal tax policies and social security mandates.</p>
    </div>
    <div class="flex gap-2">
      <button pButton icon="pi pi-plus" label="Initialize Mandate"
        class="p-button-outlined p-button-secondary font-bold" (click)="opNewPackage.toggle($event)"></button>
      <button pButton icon="pi pi-file-edit" label="Manifest New Version" class="p-button-primary shadow-2"
        (click)="opNewVersion.toggle($event)"></button>
    </div>
  </div>

  <!-- Intelligence Selector: Operational Scope -->
  <div class="card border-none shadow-sm mb-6 p-4 surface-card border-round-xl">
    <div class="flex flex-column md:flex-row align-items-center gap-6">
      <div class="filter-group">
        <label class="text-xs font-bold text-500 uppercase tracking-wider block mb-2">Governance Category</label>
        <p-selectButton [options]="ruleTypes" [(ngModel)]="selectedType" (onChange)="onTypeChange()" optionLabel="label"
          optionValue="value" styleClass="p-buttonset-sm">
        </p-selectButton>
      </div>

      <div class="flex-grow-1" *ngIf="packages.length > 0">
        <label class="text-xs font-bold text-500 uppercase tracking-wider block mb-2">Active Mandate</label>
        <p-dropdown [options]="packages" [(ngModel)]="selectedPackageId" (onChange)="loadVersions()" optionLabel="name"
          optionValue="id" placeholder="Select Mandate" styleClass="w-full md:w-20rem p-inputtext-sm">
        </p-dropdown>
      </div>
    </div>
  </div>

  <!-- Version Ledger: Power Grid Integration -->
  <div class="surface-card border-round-xl shadow-1 overflow-hidden">
    <app-data-table [columns]="columns" [data]="versions" [loading]="isLoadingVersions" [paginator]="true" [rows]="10"
      emptyMessage="No rule versions identified for the selected mandate.">
      <ng-template #rowActions let-item>
        <div class="flex gap-2 justify-content-end">
          <button pButton icon="pi pi-bolt" label="Enforce"
            class="p-button-outlined p-button-sm p-button-success font-bold" *ngIf="!item.isActive"
            (click)="activateVersion(item)"></button>
          <p-tag *ngIf="item.isActive" severity="success" value="PRIMARY" icon="pi pi-check-circle" class="mr-2">
          </p-tag>
          <button pButton icon="pi pi-code" class="p-button-text p-button-sm p-button-secondary"
            pTooltip="View Manifest JSON"></button>
        </div>
      </ng-template>
    </app-data-table>
  </div>
</div>

<!-- Overlay: New Mandate Initialization -->
<p-overlayPanel #opNewPackage styleClass="p-0 shadow-lg border-round-xl">
  <div class="p-4 w-20rem">
    <h3 class="m-0 text-lg font-bold mb-4">Initialize Mandate</h3>
    <div class="flex flex-column gap-3">
      <div class="flex flex-column gap-2">
        <label class="text-sm font-medium">Mandate Name</label>
        <input pInputText [(ngModel)]="packageForm.name" placeholder="e.g. SL APIT 2024" />
      </div>
      <div class="flex flex-column gap-2">
        <label class="text-sm font-medium">Institutional ID</label>
        <input pInputText [(ngModel)]="packageForm.companyId" placeholder="e.g. WB-HO" />
      </div>
      <button pButton label="Establish" class="w-full mt-2" (click)="createPackage(); opNewPackage.hide()"></button>
    </div>
  </div>
</p-overlayPanel>

<!-- Overlay: Version Manifestation -->
<p-overlayPanel #opNewVersion styleClass="p-0 shadow-lg border-round-xl">
  <div class="p-4 w-30rem">
    <h3 class="m-0 text-lg font-bold mb-4">Manifest New Version</h3>
    <div class="flex flex-column gap-3">
      <div class="grid p-0">
        <div class="col-6 flex flex-column gap-2">
          <label class="text-sm font-medium">Enforcement Start</label>
          <input pInputText [(ngModel)]="versionForm.effectiveFrom" type="date" />
        </div>
        <div class="col-6 flex flex-column gap-2">
          <label class="text-sm font-medium">Enforcement End</label>
          <input pInputText [(ngModel)]="versionForm.effectiveTo" type="date" />
        </div>
      </div>
      <div class="flex flex-column gap-2">
        <label class="text-sm font-medium">JSON Manifest Content</label>
        <textarea pInputTextarea [(ngModel)]="versionForm.contentJson" rows="8"
          placeholder='{"base": 30000, "rate": 0.06}'></textarea>
      </div>
      <button pButton label="Manifest" class="w-full mt-2" (click)="createVersion(); opNewVersion.hide()"></button>
    </div>
  </div>
</p-overlayPanel>

<p-toast></p-toast>
