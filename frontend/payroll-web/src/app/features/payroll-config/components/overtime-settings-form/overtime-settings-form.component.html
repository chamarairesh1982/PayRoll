<form [formGroup]="form" (ngSubmit)="submit()" class="form">
  <div class="form-row">
    <label>
      OT type
      <select formControlName="type">
        <option *ngFor="let type of overtimeTypes" [value]="type">{{ type }}</option>
      </select>
    </label>
    <label>
      Multiplier
      <input type="number" step="0.01" formControlName="multiplier" />
    </label>
  </div>

  <div class="form-row">
    <label>
      Round to minutes
      <input type="number" step="1" formControlName="roundToMinutes" />
      <span class="helper-text">Allowed values: 1, 5, 10, 15, 30, 60.</span>
    </label>
    <label>
      Rounding mode
      <select formControlName="roundingMode">
        <option *ngFor="let mode of roundingModes" [value]="mode">{{ mode }}</option>
      </select>
    </label>
  </div>

  <div class="form-row">
    <label>
      Daily cap (hours)
      <input type="number" step="0.1" formControlName="dailyHoursCap" />
      <span class="helper-text">Leave blank for no daily cap.</span>
    </label>
    <label>
      Monthly cap (hours)
      <input type="number" step="0.1" formControlName="monthlyHoursCap" />
      <span class="helper-text">Leave blank for no monthly cap.</span>
    </label>
  </div>

  <div class="form-row">
    <label>
      Effective from
      <input type="date" formControlName="effectiveFrom" />
    </label>
    <label>
      Effective to
      <input type="date" formControlName="effectiveTo" />
    </label>
  </div>

  <div class="form-row">
    <label class="checkbox">
      <input type="checkbox" formControlName="isActive" />
      Active rule
    </label>
  </div>

  <button type="submit" [disabled]="isSaving">{{ isSaving ? 'Saving...' : 'Save overtime rules' }}</button>
</form>
