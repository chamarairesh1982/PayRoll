<div class="page-header">
  <h1>Edit Bank</h1>
  <button type="button" class="secondary" (click)="goBack()">Back to List</button>
</div>

<ng-template #loading>
  <div class="loading">Loading bank...</div>
</ng-template>

<div *ngIf="bank; else loading">
  <app-bank-form [initialValue]="bank" mode="edit" (submitted)="handleSubmit($event)"></app-bank-form>
</div>
