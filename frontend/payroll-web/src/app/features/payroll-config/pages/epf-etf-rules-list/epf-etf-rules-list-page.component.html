<div class="page-container animate-fadeIn">
  <!-- Context Header: Institutional Governance -->
  <div class="flex flex-column md:flex-row md:justify-content-between md:align-items-end gap-4 mb-6">
    <div>
      <h1 class="m-0 text-3xl font-extrabold tracking-tight text-900 line-height-1">Colombo Social Security Framework
      </h1>
      <p class="text-600 mt-2 mb-0">Management of institutional EPF (8/12%) and ETF (3%) contribution mandates.</p>
    </div>
    <div class="flex gap-2">
      <button pButton icon="pi pi-shield" label="Initialize New Mandate" class="p-button-primary shadow-2"
        (click)="navigateToCreate()"></button>
    </div>
  </div>

  <!-- Intelligence Filters: Scope Management -->
  <div class="card border-none shadow-sm mb-6 p-4 surface-card border-round-xl">
    <div class="flex align-items-center justify-content-between gap-4">
      <div class="flex align-items-center gap-4">
        <div class="filter-group">
          <label class="text-xs font-bold text-500 uppercase tracking-wider block mb-2">Policy Status</label>
          <p-selectButton
            [options]="[{label: 'Active', value: 'active'}, {label: 'Archived', value: 'inactive'}, {label: 'All', value: 'all'}]"
            [(ngModel)]="filterIsActive" (onChange)="handleFilterChange()" styleClass="p-buttonset-sm">
          </p-selectButton>
        </div>
      </div>
      <div class="flex gap-3 text-right">
        <div class="p-3 bg-blue-50 border-round-lg text-blue-700">
          <span class="block text-xs font-bold uppercase">Standard EE EPF</span>
          <span class="text-xl font-black">8.00%</span>
        </div>
        <div class="p-3 bg-emerald-50 border-round-lg text-emerald-700">
          <span class="block text-xs font-bold uppercase">Standard ER EPF</span>
          <span class="text-xl font-black">12.00%</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Governance Ledger: Power Grid Integration -->
  <div class="surface-card border-round-xl shadow-1 overflow-hidden">
    <app-data-table [columns]="columns" [data]="items" [loading]="isLoading" [totalRecords]="totalCount" [lazy]="true"
      (lazyLoad)="load($event)" [paginator]="true" [rows]="10" [showGlobalFilter]="true"
      emptyMessage="No social security mandates identified within the current governance scope.">
      <ng-template #rowActions let-item>
        <div class="flex gap-1 justify-content-end">
          <button pButton icon="pi pi-pencil" class="p-button-text p-button-sm p-button-secondary"
            pTooltip="Modify Parameters" (click)="navigateToEdit(item)"></button>
          <button pButton icon="pi pi-history" class="p-button-text p-button-sm p-button-info"
            pTooltip="View Modification Trail"></button>
        </div>
      </ng-template>
    </app-data-table>
  </div>
</div>

<p-toast></p-toast>
