<div class="page-header">
  <h1>Bank Details</h1>
  <div class="actions">
    <button type="button" class="secondary" (click)="goBack()">Back to List</button>
    <button type="button" (click)="editBank()">Edit</button>
  </div>
</div>

<ng-template #loading>
  <div class="loading">Loading bank...</div>
</ng-template>

<div *ngIf="bank; else loading">
  <app-bank-form [initialValue]="bank" mode="view"></app-bank-form>
</div>
