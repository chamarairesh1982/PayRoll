<div class="page-container">
  <!-- Context Header: Allowance Framework -->
  <div class="context-header">
    <div class="header-content">
      <div class="title-area">
        <h1>Allowance Framework</h1>
        <p>Manage systematically classified institutional pay components and statutory rules</p>
      </div>
    </div>
    <div class="header-actions">
      <button pButton label="Define Component" icon="pi pi-plus" class="p-button-primary shadow-2"
        (click)="navigateToCreate()"></button>
    </div>
  </div>

  <!-- Intelligence Filters -->
  <div class="filter-runtime p-4 mb-4">
    <div class="grid align-items-end">
      <div class="col-12 md:col-3">
        <label class="block text-sm font-medium mb-2">Operational Status</label>
        <p-dropdown
          [options]="[{label: 'Show All', value: 'all'}, {label: 'Active Only', value: 'active'}, {label: 'Inactive', value: 'inactive'}]"
          [(ngModel)]="filterIsActive" (onChange)="handleFilterChange()" styleClass="w-full"></p-dropdown>
      </div>
      <div class="col-12 md:col-9 text-right font-medium text-500">
        <span class="mr-2">{{ totalCount }} Infrastructure Components Registered</span>
      </div>
    </div>
  </div>

  <!-- Power Grid: Allowance Ledger -->
  <div class="grid-container">
    <app-data-table [data]="items" [columns]="columns" [loading]="isLoading" [totalRecords]="totalCount"
      [paginator]="true" [rows]="pageSize" [showGlobalFilter]="true" (onLazyLoad)="load()">
      <!-- Row Actions -->
      <ng-template #rowActions let-row>
        <div class="flex gap-2">
          <button pButton icon="pi pi-pencil" class="p-button-rounded p-button-secondary p-button-text"
            pTooltip="Modify Configuration" (click)="navigateToEdit(row)"></button>
          <button pButton icon="pi pi-trash" class="p-button-rounded p-button-danger p-button-text"
            pTooltip="Decommission Component" (click)="confirmDelete(row)"></button>
        </div>
      </ng-template>
    </app-data-table>
  </div>
</div>

<!-- Decommissioning Confirmation -->
<p-confirmDialog header="Strategic Decommissioning" icon="pi pi-exclamation-triangle"></p-confirmDialog>
<p-toast></p-toast>
