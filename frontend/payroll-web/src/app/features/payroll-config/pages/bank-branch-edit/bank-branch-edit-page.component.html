<div class="page-header">
  <h1>Edit Bank Branch</h1>
  <button type="button" class="secondary" (click)="goBack()">Back to List</button>
</div>

<ng-template #loading>
  <div class="loading">Loading bank branch...</div>
</ng-template>

<div *ngIf="branch; else loading">
  <app-bank-branch-form [banks]="banks" [initialValue]="branch" mode="edit" (submitted)="handleSubmit($event)"></app-bank-branch-form>
</div>
