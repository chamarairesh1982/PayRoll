<div class="page-header">
  <div>
    <h1>Leave Requests</h1>
    <p class="subtitle">Review and manage leave requests across teams.</p>
  </div>
  <button pButton type="button" label="Create Leave Request" icon="pi pi-plus" class="p-button-raised" (click)="goToCreate()"></button>
</div>

<div class="filters p-fluid">
  <div class="field">
    <label for="employeeFilter">Employee</label>
    <input
      pInputText
      id="employeeFilter"
      type="text"
      [(ngModel)]="selectedEmployeeId"
      placeholder="Employee ID or Code"
    />
  </div>

  <div class="field">
    <label for="statusFilter">Status</label>
    <p-dropdown
      id="statusFilter"
      [options]="statusOptions"
      [(ngModel)]="selectedStatus"
      placeholder="All"
      [showClear]="true"
    ></p-dropdown>
  </div>

  <div class="filter-actions">
    <button pButton type="button" label="Apply" icon="pi pi-filter" (click)="applyFilters()"></button>
    <button
      pButton
      type="button"
      label="Reset"
      icon="pi pi-refresh"
      class="p-button-outlined"
      (click)="resetFilters()"
    ></button>
  </div>
</div>

<ng-template #actions let-request>
  <div class="actions">
    <button pButton type="button" label="View" class="p-button-text" (click)="viewRequest(request)"></button>
    <button pButton type="button" label="Edit" class="p-button-text" (click)="editRequest(request)"></button>
    <button
      pButton
      type="button"
      label="Delete"
      class="p-button-text p-button-danger"
      (click)="confirmDelete(request)"
    ></button>
  </div>
</ng-template>

<app-data-table
  [columns]="columns"
  [data]="requests"
  [actionsTemplate]="actions"
  [loading]="isLoading"
  [totalRecords]="totalCount"
  [rows]="pageSize"
  [first]="tableFirst"
  [paginator]="true"
  [lazy]="true"
  [showColumnFilters]="false"
  [emptyMessage]="'No leave requests found.'"
  (lazyLoad)="handleLazyLoad($event)"
></app-data-table>

<div class="dialog-wrapper" *ngIf="showConfirm">
  <app-confirm-dialog
    title="Delete Leave Request"
    [message]="'Are you sure you want to delete leave request for ' + (requestToDelete?.employeeName || requestToDelete?.employeeCode || requestToDelete?.employeeId) + '?'"
    (confirmed)="deleteRequest()"
    (cancelled)="cancelDelete()"
  ></app-confirm-dialog>
</div>
